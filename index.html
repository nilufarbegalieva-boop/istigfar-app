<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Книга Истигфара - 40 000</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --primary: #1b4332;
            --secondary: #d4af37;
            --bg-color: #f4f6f4;
            --card-bg: #ffffff;
            --text-main: #2d3748;
            --text-muted: #718096;
            --circle-empty: #e2e8f0;
            --circle-filled: #1b4332;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 450px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding-bottom: 30px;
        }

        /* Шапка */
        .header {
            background: var(--primary);
            color: white;
            padding: 14px;
            border-radius: 16px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(27, 67, 50, 0.2);
        }

        .header h1 {
            margin: 0 0 4px 0;
            font-size: 19px;
            color: var(--secondary);
        }

        .total-progress {
            font-size: 13px;
            opacity: 0.9;
        }

        /* Навигация по дням */
        .day-nav {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--card-bg);
            padding: 8px 12px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }

        .day-nav button {
            background: var(--primary);
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 13px;
        }

        #current-day-title {
            font-size: 17px;
            font-weight: bold;
            color: var(--primary);
        }

        /* Карточка дня */
        .book-card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }

        /* Блок дат и лунного календаря */
        .date-section {
            background: #f8fafc;
            border-radius: 12px;
            padding: 10px;
            margin-bottom: 14px;
            border: 1px solid #e2e8f0;
        }

        .date-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            margin-bottom: 6px;
        }

        .date-row input {
            border: 1px solid #cbd5e0;
            border-radius: 6px;
            padding: 4px 8px;
            font-size: 12px;
        }

        .hijri-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            color: var(--primary);
            font-weight: 600;
            padding-top: 4px;
            border-top: 1px dashed #cbd5e0;
        }

        /* Сетка кружков с цифрами 10 ВНУТРИ */
        .circles-grid {
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            gap: 6px;
            margin-bottom: 16px;
        }

        .circle {
            width: 100%;
            aspect-ratio: 1;
            background-color: var(--circle-empty);
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            font-weight: bold;
            color: #4a5568;
            user-select: none;
            transition: all 0.15s ease;
        }

        .circle.filled {
            background-color: var(--circle-filled);
            color: #ffffff;
            box-shadow: 0 2px 5px rgba(27, 67, 50, 0.4);
        }

        .day-stats {
            text-align: center;
            font-size: 14px;
            font-weight: bold;
            color: var(--primary);
            margin-bottom: 12px;
        }

        /* Блок Хадисов внизу (Листалка) */
        .hadith-card {
            background: #faf6ed;
            border: 1.5px solid var(--secondary);
            border-radius: 14px;
            padding: 14px;
            margin-top: 12px;
        }

        .hadith-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .hadith-header h3 {
            margin: 0;
            font-size: 14px;
            color: var(--primary);
        }

        .hadith-nav-btn {
            background: var(--secondary);
            color: #1a202c;
            border: none;
            border-radius: 6px;
            padding: 3px 8px;
            font-size: 12px;
            cursor: pointer;
            font-weight: bold;
        }

        .hadith-text {
            font-size: 13px;
            line-height: 1.5;
            color: #2d3748;
            margin: 0;
            min-height: 50px;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Шапка -->
    <div class="header">
        <h1>Книга Истигфара</h1>
        <div class="total-progress" id="total-progress-text">Всего прочитано: 0 / 40 000</div>
    </div>

    <!-- Навигация по дням -->
    <div class="day-nav">
        <button onclick="changeDay(-1)">← Назад</button>
        <span id="current-day-title">День 1</span>
        <button onclick="changeDay(1)">Вперед →</button>
    </div>

    <!-- Основная страница -->
    <div class="book-card">
        <!-- Блок Даты и Лунного Календаря -->
        <div class="date-section">
            <div class="date-row">
                <span>Григорианская дата:</span>
                <input type="date" id="date-input" onchange="onDateChange()">
            </div>
            <div class="hijri-row">
                <span>🌙 Хиджра:</span>
                <span id="hijri-date-text">Загрузка...</span>
            </div>
        </div>

        <!-- 100 кружков -->
        <div class="circles-grid" id="circles-container"></div>

        <div class="day-stats" id="day-stats-text">Выполнено за день: 0 / 1000</div>

        <!-- Ниже расположенный блок Хадисов и Пользы (Листалка) -->
        <div class="hadith-card">
            <div class="hadith-header">
                <h3>✨ Польза дня & Хадис</h3>
                <div>
                    <button class="hadith-nav-btn" onclick="changeHadith(-1)">←</button>
                    <span id="hadith-counter" style="font-size: 11px; margin: 0 4px;">1/5</span>
                    <button class="hadith-nav-btn" onclick="changeHadith(1)">→</button>
                </div>
            </div>
            <p class="hadith-text" id="hadith-text-content"></p>
        </div>
    </div>
</div>

<script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    let currentDay = 1;
    let currentHadithIndex = 0;
    const totalDays = 40;
    
    const hadiths = [
        "«Кто постоянно совершает истигфар, тому Аллах найдет выход из любой тесноты и утешение от каждой печали» (Абу Дауд).",
        "Посланник Аллаха (мир ему) сказал: «Повинен тот, кто совершил грех, а затем встал, совершил омовение, помолился и попросил прощения у Аллаха — и Аллах простит его».",
        "Истигфар — это ключ к прощению, очищению сердца и привлечению благословенного удела (ризк).",
        "Сказал Аль-Хасан аль-Басри: «Чаще просите прощения у Аллаха в своих домах, за вашими столами, на дорогах и на рынках, ибо вы не знаете, когда снизойдет милость».",
        "Посланник Аллаха (мир ему) просил прощения у Аллаха и каялся перед Ним более ста раз в день."
    ];

    function getStorageKey(day) { return `istigfar_day_${day}`; }
    function getDateKey(day) { return `istigfar_date_${day}`; }

    // Конвертер в Лунный календарь Хиджры
    function updateHijriDate(dateString) {
        try {
            const dateParts = dateString.split('-');
            const dateObj = new Date(dateParts[0], dateParts[1] - 1, dateParts[2]);
            const formatter = new Intl.DateTimeFormat('ru-RU-u-ca-islamic-uma', {
                day: 'numeric',
                month: 'long',
                year: 'numeric'
            });
            document.getElementById('hijri-date-text').innerText = formatter.format(dateObj) + " AH";
        } catch (e) {
            document.getElementById('hijri-date-text').innerText = "Определяется...";
        }
    }

    function initDay() {
        document.getElementById('current-day-title').innerText = `День ${currentDay}`;
        
        const container = document.getElementById('circles-container');
        container.innerHTML = '';
        
        let filledCount = 0;
        let savedData = JSON.parse(localStorage.getItem(getStorageKey(currentDay))) || Array(100).fill(false);

        for (let i = 0; i < 100; i++) {
            const circle = document.createElement('div');
            circle.className = `circle ${savedData[i] ? 'filled' : ''}`;
            circle.innerText = '10'; // Цифра 10 прямо ВНУТРИ
            circle.onclick = () => toggleCircle(i);
            container.appendChild(circle);
            if (savedData[i]) filledCount++;
        }

        updateStats(filledCount);

        const savedDate = localStorage.getItem(getDateKey(currentDay)) || new Date().toISOString().split('T')[0];
        document.getElementById('date-input').value = savedDate;
        updateHijriDate(savedDate);

        currentHadithIndex = (currentDay - 1) % hadiths.length;
        showHadith();
    }

    function toggleCircle(index) {
        if (tg.HapticFeedback) {
            tg.HapticFeedback.impactOccurred('light');
        }

        let savedData = JSON.parse(localStorage.getItem(getStorageKey(currentDay))) || Array(100).fill(false);
        savedData[index] = !savedData[index];
        localStorage.setItem(getStorageKey(currentDay), JSON.stringify(savedData));
        
        initDay();
        updateTotalProgress();
    }

    function updateStats(filledCount) {
        const totalIstigfar = filledCount * 10;
        document.getElementById('day-stats-text').innerText = `Выполнено за день: ${totalIstigfar} / 1000`;
    }

    function updateTotalProgress() {
        let total = 0;
        for (let d = 1; d <= totalDays; d++) {
            let savedData = JSON.parse(localStorage.getItem(getStorageKey(d))) || Array(100).fill(false);
            let count = savedData.filter(Boolean).length;
            total += count * 10;
        }
        document.getElementById('total-progress-text').innerText = `Всего прочитано: ${total} / 40 000`;
    }

    function changeDay(direction) {
        currentDay += direction;
        if (currentDay < 1) currentDay = 1;
        if (currentDay > totalDays) currentDay = totalDays;
        initDay();
    }

    function onDateChange() {
        const dateVal = document.getElementById('date-input').value;
        localStorage.setItem(getDateKey(currentDay), dateVal);
        updateHijriDate(dateVal);
    }

    function changeHadith(direction) {
        currentHadithIndex += direction;
        if (currentHadithIndex < 0) currentHadithIndex = hadiths.length - 1;
        if (currentHadithIndex >= hadiths.length) currentHadithIndex = 0;
        showHadith();
    }

    function showHadith() {
        document.getElementById('hadith-text-content').innerText = hadiths[currentHadithIndex];
        document.getElementById('hadith-counter').innerText = `${currentHadithIndex + 1}/${hadiths.length}`;
    }

    initDay();
    updateTotalProgress();
</script>

</body>
</html>
